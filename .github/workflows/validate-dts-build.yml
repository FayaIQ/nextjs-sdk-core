name: Validate SDK declaration build

on:
  push:
    branches:
      - agent/fix-dts-build
  pull_request:
    branches:
      - prod-3

permissions:
  contents: write

concurrency:
  group: validate-sdk-dts-agent-fix
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-dts-build
          fetch-depth: 0

      - name: Apply API declaration compatibility patch
        run: node scripts/fix-api-static-modifiers.cjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate exact Git dependency prepare lifecycle
        run: |
          rm -rf dist
          npm run prepare

      - name: Commit finalized source
        shell: bash
        run: |
          rm -f scripts/fix-api-static-modifiers.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize API declaration compatibility"
            git push origin HEAD:agent/fix-dts-build
          fi
